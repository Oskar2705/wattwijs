services:
  energiemonitor:
    build: .
    container_name: energiemonitor
    restart: unless-stopped
    env_file: .env
    ports:
      # Host port: set HOST_PORT in .env to use another one, e.g. HOST_PORT=8095
      - "${HOST_PORT:-8000}:8000"
    volumes:
      - ./data:/data
    labels:
      # The image is built locally, so Watchtower should leave it alone
      - com.centurylinklabs.watchtower.enable=false
